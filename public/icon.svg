<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tamimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#99000A" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181A22" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgDark)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Dynamic Glow Circle Behind Logo -->
  <circle cx="256" cy="256" r="140" fill="#E50914" opacity="0.18" filter="url(#glow)" />
  
  <!-- Stylized Geometric T-Play Emblem -->
  <!-- Top Bar of T -->
  <path d="M 120 148 C 120 134 132 124 146 124 L 366 124 C 380 124 392 134 392 148 L 392 176 C 392 190 380 200 366 200 L 146 200 C 132 200 120 190 120 176 Z" fill="url(#tamimGrad)" />
  
  <!-- Vertical Stem with Media Play Angle -->
  <path d="M 216 200 L 296 200 L 296 332 C 296 348 284 362 268 368 L 256 372 L 244 368 C 228 362 216 348 216 332 Z" fill="url(#tamimGrad)" />

  <!-- Play Symbol Accent Cutout in Stem -->
  <path d="M 242 246 L 278 268 L 242 290 Z" fill="#FFFFFF" opacity="0.95" />
  
  <!-- Infinite Loop Orbit Accent -->
  <path d="M 136 384 C 180 340 332 340 376 384 C 400 408 376 436 344 436 C 292 436 220 384 168 384 C 136 384 112 408 136 432 C 160 456 220 440 256 420" 
        fill="none" stroke="#FF4757" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
</svg>
